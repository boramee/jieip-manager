name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows x64
        run: dotnet publish JieipManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Rename executable
        shell: pwsh
        run: Move-Item "publish/지입관리.exe" "publish/JieipManager-win-x64.exe"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/JieipManager-win-x64.exe
          generate_release_notes: true

